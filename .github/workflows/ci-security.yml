name: CI & Security Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Quét lộ Secret, Token, Password nhạy cảm
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Job 2: Chạy Unit Test Spring Boot & Caching Maven
  build-and-test:
    name: Build & Test (Java Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 # Hoặc đổi thành 21 nếu dự án dùng Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw test